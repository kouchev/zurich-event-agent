<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zurich Events · __PAGETITLE__</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #b4321e; --accent-soft: #fbeae6; --new: #1f6f43; --new-soft: #e3f3e9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1e1e21; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
            --accent: #ff7a63; --accent-soft: #3a2420; --new: #6fd39a; --new-soft: #1b3326; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 14px 16px 10px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .tabs { display: flex; gap: 4px; margin: 8px 0 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs a { padding: 6px 12px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px;
            border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current=page] { color: var(--ink); border-bottom-color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  input[type=search] { flex: 1 1 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                       background: var(--card); color: var(--ink); font: inherit; }
  label.from { font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  input[type=time] { padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
                     color: var(--ink); font: inherit; font-size: 13px; color-scheme: light dark; }
  label.tog { font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
          padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip[aria-pressed=false] { opacity: .45; }
  .chip.bulk { background: transparent; border-style: dashed; color: var(--muted); font-weight: 600; }
  .chip.bulk:hover { color: var(--ink); border-color: var(--muted); }
  .chip.bulk[data-act=none] { margin-right: 6px; }
  main { padding: 6px 16px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 22px 0 8px; font-weight: 600; }
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 12px; background: var(--card);
        border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .ev.star { border-left: 3px solid var(--accent); }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; padding-top: 1px; }
  .time.small { font-size: 12px; font-weight: 500; color: var(--muted); line-height: 1.3; }
  .ev:has(.time.small) { grid-template-columns: 64px 1fr; }
  .title { font-weight: 600; color: var(--ink); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 1px; }
  .tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
  .badge { border-radius: 4px; padding: 0 6px; font-size: 11.5px; font-weight: 600; }
  .b-new { background: var(--new-soft); color: var(--new); }
  .b-star { background: var(--accent-soft); color: var(--accent); }
  footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 30px; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .topics .lbl { color: var(--accent); font-weight: 600; margin-right: 2px; }
  .chip.topic { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip.topic span { opacity: .6; margin-left: 4px; }
  #topicIn { border: 1px dashed var(--line); background: transparent; color: var(--ink); border-radius: 999px;
             padding: 3px 10px; font: inherit; font-size: 12.5px; width: 170px; }
  .err { color: var(--accent); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Zurich Events</h1>
  <nav class="tabs" aria-label="Pages">__NAV__</nav>
  <div class="meta">__DESCRIPTION__ · last scan __UPDATED__ · <span id="count"></span></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search title, artist, venue, genre…" aria-label="Search">
    <label class="from" title="Hide events that start before this time; clear it to show all">From
      <input type="time" id="fromTime" step="900" aria-label="Show events starting from"></label>
    <label class="tog"><input type="checkbox" id="onlyNew"> New only</label>
    <label class="tog"><input type="checkbox" id="onlyStar"> Starred only</label>
  </div>
  <div class="chips" id="venues"></div>
  <div class="topics"><span class="lbl">★ Topics</span><span class="chips" id="topics" style="margin:0"></span>
    <input id="topicIn" placeholder="add a topic + Enter" aria-label="Add a star topic" enterkeyhint="done"></div>
</div></header>
<main class="wrap" id="list"></main>
<div class="wrap" style="padding:0 16px 30px"><footer id="status"></footer></div>
<script>
const EVENTS = /*EVENTS*/[];
const STATUS = /*STATUS*/[];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const venueKey = e => e.venue.split(" – ")[0];
const venues = [...new Set(EVENTS.map(venueKey))].sort();
const HIDDEN_KEY = "hiddenVenues:__PAGEID__";
let hidden = new Set();
try { hidden = new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]")); } catch {}

$("venues").innerHTML =
  `<button class="chip bulk" data-act="all">All</button><button class="chip bulk" data-act="none">None</button>` +
  venues.map(v => `<button class="chip" data-v="${esc(v)}" aria-pressed="${!hidden.has(v)}">${esc(v)}</button>`).join("");
$("venues").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  if (b.dataset.act) {
    hidden = new Set(b.dataset.act === "none" ? venues : []);
  } else {
    const v = b.dataset.v; hidden.has(v) ? hidden.delete(v) : hidden.add(v);
  }
  $("venues").querySelectorAll("[data-v]").forEach(c => c.setAttribute("aria-pressed", !hidden.has(c.dataset.v)));
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hidden])); } catch {}
  draw();
});
["q", "onlyNew", "onlyStar"].forEach(id => $(id).addEventListener("input", draw));

// "From" start time: saved in this browser only, per page. Empty means any time.
const FROM_KEY = "fromTime:__PAGEID__";
try { $("fromTime").value = localStorage.getItem(FROM_KEY) || ""; } catch {}
$("fromTime").addEventListener("change", () => {
  try { localStorage.setItem(FROM_KEY, $("fromTime").value); } catch {}
  draw();
});

// Star topics typed on the page: saved in this browser only, per page, on top of config.toml's words.
const TOPICS_KEY = "starTopics:__PAGEID__";
let topics = [];
try { topics = JSON.parse(localStorage.getItem(TOPICS_KEY) || "[]"); } catch {}
let topicRes = [];
function setTopics(list) {
  topics = [...new Set(list.map(t => t.trim()).filter(Boolean))];
  try { localStorage.setItem(TOPICS_KEY, JSON.stringify(topics)); } catch {}
  // whole-word, case-insensitive, Unicode-aware (so "oper" does not match "Operationalizing")
  topicRes = topics.map(t => new RegExp(`(?<![\\p{L}\\p{N}])${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\p{L}\\p{N}])`, "iu"));
  $("topics").innerHTML = topics.map((t, i) =>
    `<button class="chip topic" data-i="${i}" title="Remove">${esc(t)}<span>×</span></button>`).join("");
  draw();
}
const starred = e => e.highlight ||
  (topicRes.length && topicRes.some(r => r.test([e.title, e.subtitle, e.category, e.venue].join(" "))));
$("topicIn").addEventListener("keydown", ev => {
  if (ev.key !== "Enter" || !ev.target.value.trim()) return;
  setTopics([...topics, ...ev.target.value.split(",")]); ev.target.value = "";
});
$("topics").addEventListener("click", ev => {
  const b = ev.target.closest(".topic"); if (b) setTopics(topics.filter((_, i) => i != b.dataset.i));
});

const dayFmt = new Intl.DateTimeFormat("en-GB", {weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Europe/Zurich"});
const timeFmt = new Intl.DateTimeFormat("de-CH", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zurich"});
const untilFmt = new Intl.DateTimeFormat("de-CH", {day: "2-digit", month: "2-digit", year: "2-digit", timeZone: "Europe/Zurich"});

function draw() {
  const q = $("q").value.trim().toLowerCase();
  const from = $("fromTime").value;   // "HH:MM" or ""
  const list = EVENTS.filter(e =>
    !hidden.has(venueKey(e)) &&
    // events without a start time (all-day, exhibitions) stay visible
    (!from || e.allday || e.end || timeFmt.format(new Date(e.start)) >= from) &&
    (!$("onlyNew").checked || e.new) &&
    (!$("onlyStar").checked || starred(e)) &&
    (!q || [e.title, e.subtitle, e.venue, e.category].join(" ").toLowerCase().includes(q)));
  $("count").textContent = `${list.length} of ${EVENTS.length} events`;
  // long-running items (exhibitions) that have already opened go into "On now"
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const running = list.filter(e => e.end && new Date(e.start) < today);
  const dated = list.filter(e => !running.includes(e));
  let html = running.length ? `<h2>On now</h2>` + running.map(e => card(e, "until " + untilFmt.format(new Date(e.end)))).join("") : "";
  let lastDay = "";
  for (const e of dated) {
    const d = new Date(e.start), day = dayFmt.format(d);
    if (day !== lastDay) { html += `<h2>${esc(day)}</h2>`; lastDay = day; }
    html += card(e, e.allday ? "–" : timeFmt.format(d));
  }
  $("list").innerHTML = html || `<div class="empty">No events match.</div>`;
}

function card(e, when) {
  return `<article class="ev${starred(e) ? " star" : ""}">
      <div class="time${e.end ? " small" : ""}">${esc(when)}</div>
      <div>
        <a class="title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
        ${e.subtitle ? `<div class="sub">${esc(e.subtitle)}</div>` : ""}
        <div class="tags"><span>${esc(e.venue)}</span><span>· ${esc(e.category)}</span>
          ${e.new ? `<span class="badge b-new">NEW</span>` : ""}
          ${starred(e) ? `<span class="badge b-star">★</span>` : ""}</div>
      </div></article>`;
}
setTopics(topics);   // builds the topic chips and draws the list

$("status").innerHTML = "Sources in last scan: " + (STATUS.map(s =>
  s.ok ? `${esc(s.source)} (${s.count})` : `<span class="err" title="${esc(s.message)}">${esc(s.source)} ✗ failed</span>`
).join(" · ") || "none");
</script>
</body>
</html>
