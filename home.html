<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zurich Events</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #b4321e; --new: #1f6f43; --new-soft: #e3f3e9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1e1e21; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
            --accent: #ff7a63; --new: #6fd39a; --new-soft: #1b3326; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .health { color: var(--new); text-decoration: none; font-weight: 600; }
  .health.bad { color: var(--accent); }
  .health:hover { text-decoration: underline; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  a.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 16px 18px; color: inherit; text-decoration: none;
           transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card h2 { font-size: 19px; margin: 0 0 2px; }
  .desc { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; }
  .stats { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; }
  .num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .unit { color: var(--muted); font-size: 13px; }
  .badge { background: var(--new-soft); color: var(--new); border-radius: 4px; padding: 1px 7px;
           font-size: 12px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); flex: 1; }
  li { font-size: 13.5px; padding: 3px 0; display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
  li .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  li .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go { margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Zurich Events</h1>
  <div class="meta">Collected daily from Zurich venues and universities · last scan __UPDATED__ · __HEALTH__ ·
    <a class="health" href="my.html" style="color:inherit">📅 My picks</a></div>
  <div class="grid">
__CARDS__
  </div>
</div>
</body>
</html>
