# Zurich event agent configuration. Edit freely; changes apply on the next run.

[general]
days_ahead = 120            # ignore events further out than this
user_agent = "zurich-event-agent/0.1 (personal, non-commercial; daily fetch)"
request_delay_seconds = 2   # pause between requests to the same site
max_pages = 20              # upper limit when following a site's "next page" links

[filter]
# Case-insensitive substrings matched against title, subtitle, category and venue.
# Events matching any "exclude" term are dropped.
exclude = [
  "schulworkshop", "schulen", "schulklasse", "für schulen",
  "lehrpersonen", "corporate event", "eishockey", "swiss cup", "rechtsberatung",
]
# Events matching any "highlight" term get a ★ and can be shown alone via "Starred only".
highlight = [
  "jazz", "quartet", "quartett", "trio", "piano", "klavier", "orchester",
  "oper", "opera", "ballett", "ballet", "premiere", "ausstellung", "exhibition",
]

# Toggle individual sources on/off.
[sources]
opernhaus = true
tonhalle = true
schauspielhaus = true
moods = true
kaufleuten = true
bogenf = true
rotefabrik = true
gessnerallee = true
hallenstadion = true
museum_gestaltung = true
rigiblick = true
kunsthaus = true
eth = true
uzh = true

# Pages of the web site, in tab order. The first page is the start page (index.html).
# Each source belongs to one page; to add a page, add a [[pages]] block and move sources into it.
[[pages]]
id = "culture"
title = "Culture"
description = "Music, theatre, opera & exhibitions"
sources = ["opernhaus", "tonhalle", "schauspielhaus", "moods", "kaufleuten", "bogenf", "rotefabrik",
           "gessnerallee", "hallenstadion", "museum_gestaltung", "rigiblick", "kunsthaus"]

[[pages]]
id = "education"
title = "Education"
description = "Lectures, seminars & public events at ETH and UZH"
sources = ["eth", "uzh"]
